<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teaching Media Hub</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --sidebar-width: 300px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body {
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .brand {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .search-wrap {
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .search-wrap input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: .95rem;
      outline: none;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .media-list {
      padding: 10px;
      overflow-y: auto;
      flex: 1 1 auto;
      min-height: 0;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .media-item {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: inherit;
    }

    .media-item:hover {
      background: #f9fafb;
    }

    .media-item.active {
      background: var(--accent-soft);
      color: #3730a3;
    }

    .media-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      border-radius: 9px;
      flex: 0 0 auto;
      font-size: 1.1rem;
    }

    .media-item.active .media-icon {
      background: #ffffff;
    }

    .media-info {
      min-width: 0;
    }

    .media-title {
      font-weight: 700;
      line-height: 1.25;
    }

    .media-category,
    .media-description {
      color: var(--muted);
      font-size: .82rem;
      margin-top: 3px;
    }

    .media-description {
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .toolbar {
      height: 62px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .toolbar .current-title {
      font-weight: 700;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar button,
    .toolbar a {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 9px;
      padding: 8px 11px;
      text-decoration: none;
      cursor: pointer;
      font-size: .9rem;
    }

    .toolbar button:hover,
    .toolbar a:hover {
      background: #f9fafb;
    }

    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #ffffff;
    }

    #mediaFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #ffffff;
    }

    .welcome {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at top left, #eef2ff, transparent 32%),
        radial-gradient(circle at bottom right, #ecfeff, transparent 30%),
        #ffffff;
    }

    .welcome-card {
      max-width: 620px;
    }

    .welcome-card h2 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
    }

    .welcome-card p {
      color: var(--muted);
      line-height: 1.7;
    }

    .empty {
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    .menu-toggle {
      display: none;
    }

    @media (max-width: 820px) {
      body { overflow: hidden; }

      .app {
        display: block;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(86vw, 320px);
        z-index: 20;
        transform: translateX(-100%);
        transition: transform .2s ease;
        box-shadow: 12px 0 28px rgba(0,0,0,.12);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        width: 100%;
      }

      .menu-toggle {
        display: inline-flex !important;
      }

      .toolbar {
        padding: 0 10px;
      }

      .toolbar a {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <h1>Teaching Media Hub</h1>
        <p>ศูนย์รวมสื่อการสอนแบบ HTML</p>
      </div>

      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="ค้นหาสื่อ..." />
      </div>

      <div class="media-list" id="mediaList"></div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <button class="menu-toggle" id="menuToggle" type="button">☰</button>
        <div class="current-title" id="currentTitle">เลือกสื่อจากเมนู</div>
        <button id="homeButton" type="button">หน้าหลัก</button>
        <a id="openNewTab" href="#" target="_blank" rel="noopener" style="display:none;">เปิดแท็บใหม่</a>
      </div>

      <div class="frame-wrap">
        <div class="welcome" id="welcome">
          <div class="welcome-card">
            <h2>Teaching Media Hub</h2>
            <p>
              เลือกสื่อจากรายการด้านซ้ายเพื่อเปิดใช้งาน
              รายการสื่อจะดึงไฟล์ทั้งหมดจากโฟลเดอร์ <strong>media</strong> โดยอัตโนมัติ
            </p>
          </div>
        </div>

        <iframe
          id="mediaFrame"
          title="Teaching media"
          allow="microphone; camera; autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      </div>
    </main>
  </div>

  <script src="media-list.js"></script>
  <script>
    const listEl = document.getElementById("mediaList");
    const frameEl = document.getElementById("mediaFrame");
    const welcomeEl = document.getElementById("welcome");
    const currentTitleEl = document.getElementById("currentTitle");
    const openNewTabEl = document.getElementById("openNewTab");
    const searchInputEl = document.getElementById("searchInput");
    const sidebarEl = document.getElementById("sidebar");
    const menuToggleEl = document.getElementById("menuToggle");
    const homeButtonEl = document.getElementById("homeButton");

    let activeId = null;

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderList(query = "") {
      const source = Array.isArray(window.MEDIA_LIST) ? window.MEDIA_LIST : [];
      const keyword = query.trim().toLowerCase();

      const filtered = source.filter(item => {
        const haystack = [
          item.title,
          item.category,
          item.description
        ].filter(Boolean).join(" ").toLowerCase();

        return haystack.includes(keyword);
      });

      if (!filtered.length) {
        listEl.innerHTML = '<div class="empty">ไม่พบสื่อ</div>';
        return;
      }

      listEl.innerHTML = filtered.map(item => `
        <button
          class="media-item ${item.id === activeId ? "active" : ""}"
          type="button"
          data-id="${escapeHtml(item.id)}">
          <span class="media-icon">${escapeHtml(item.icon || "📘")}</span>
          <span class="media-info">
            <div class="media-title">${escapeHtml(item.title || item.id)}</div>
            ${item.category ? `<div class="media-category">${escapeHtml(item.category)}</div>` : ""}
            ${item.description ? `<div class="media-description">${escapeHtml(item.description)}</div>` : ""}
          </span>
        </button>
      `).join("");

      listEl.querySelectorAll(".media-item").forEach(button => {
        button.addEventListener("click", () => openMedia(button.dataset.id));
      });
    }

    async function loadRepositoryMedia() {
      try {
        const response = await fetch(
          "https://api.github.com/repos/ajpongpob/Hub-App/contents/media?ref=main",
          { headers: { Accept: "application/vnd.github+json" } }
        );
        if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);

        const files = await response.json();
        const existing = Array.isArray(window.MEDIA_LIST) ? window.MEDIA_LIST : [];
        const knownPaths = new Set(existing.map(item => item.file));
        const discovered = files
          .filter(file => file.type === "file" && !knownPaths.has(`media/${file.name}`))
          .map(file => {
            const extension = file.name.split(".").pop().toUpperCase();
            return {
              id: `media-${file.name}`,
              title: file.name,
              file: `media/${encodeURIComponent(file.name)}`,
              category: `${extension} file`,
              description: "ไฟล์ในโฟลเดอร์ media",
              icon: extension === "HTML" ? "🎼" : "📎"
            };
          });

        window.MEDIA_LIST = [...existing, ...discovered].sort((a, b) =>
          (a.title || a.id).localeCompare(b.title || b.id, "th", { numeric: true })
        );
        renderList(searchInputEl.value);
      } catch (error) {
        console.error("โหลดรายการไฟล์จาก media ไม่สำเร็จ", error);
      }
    }

    function openMedia(id) {
      const source = Array.isArray(window.MEDIA_LIST) ? window.MEDIA_LIST : [];
      const item = source.find(entry => entry.id === id);
      if (!item) return;

      activeId = id;
      frameEl.src = item.file;
      frameEl.style.display = "block";
      welcomeEl.style.display = "none";
      currentTitleEl.textContent = item.title || item.id;

      openNewTabEl.href = item.file;
      openNewTabEl.style.display = "";

      history.replaceState(null, "", `#${encodeURIComponent(item.id)}`);
      renderList(searchInputEl.value);

      if (window.innerWidth <= 820) {
        sidebarEl.classList.remove("open");
      }
    }

    function showHome() {
      activeId = null;
      frameEl.src = "about:blank";
      frameEl.style.display = "none";
      welcomeEl.style.display = "grid";
      currentTitleEl.textContent = "เลือกสื่อจากเมนู";
      openNewTabEl.style.display = "none";
      history.replaceState(null, "", location.pathname + location.search);
      renderList(searchInputEl.value);
    }

    searchInputEl.addEventListener("input", e => renderList(e.target.value));

    menuToggleEl.addEventListener("click", () => {
      sidebarEl.classList.toggle("open");
    });

    homeButtonEl.addEventListener("click", showHome);

    renderList();
    loadRepositoryMedia();

    const initialId = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (initialId) {
      openMedia(initialId);
    }
  </script>
</body>
</html>
