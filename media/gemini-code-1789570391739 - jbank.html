<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Bit Acoustic Guitar Chords</title>
    <!-- นำเข้าฟอนต์สไตล์ 8-bit จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Press Start 2P', cursive;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #f1c40f;
            text-shadow: 3px 3px #e67e22;
            margin-bottom: 25px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        /* รูปการ์ตูน 8-bit */
        .character-img {
            width: 140px;
            height: 140px;
            border: 4px solid #fff;
            background-color: #000;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/77/Avatar_cat.png'); 
            background-size: cover;
            background-position: center;
            image-rendering: pixelated;
        }

        /* ปุ่มเปิดเสียง / แสดงสถานะ */
        .audio-status-btn {
            background-color: #e67e22 !important;
            font-size: 12px !important;
            padding: 10px 15px !important;
            margin-bottom: 10px;
        }

        /* โหมดเลือกเสียง และความดัง */
        .sound-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            align-items: center;
            font-size: 11px;
            background: #34495e;
            padding: 12px;
            border: 3px solid #000;
            border-radius: 6px;
        }
        .sound-controls label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* คอกีตาร์ (Fretboard) */
        .fretboard {
            width: 600px;
            height: 200px;
            background-color: #8e44ad;
            border: 6px solid #000;
            display: flex;
            position: relative;
            box-shadow: 10px 10px 0px #000;
            margin-top: 40px; 
            margin-left: 40px;
            margin-right: 20px;
        }
        .fret {
            flex: 1;
            border-right: 4px solid #bdc3c7;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .fret:last-child {
            border-right: none;
        }
        /* สายกีตาร์ */
        .string-line {
            width: 100%;
            height: 4px;
            background-color: #ecf0f1;
            position: absolute;
            z-index: 1;
        }
        .string-1 { top: 10%; }
        .string-2 { top: 26%; }
        .string-3 { top: 42%; }
        .string-4 { top: 58%; }
        .string-5 { top: 74%; }
        .string-6 { top: 90%; }

        /* จุดที่กด (Notes) */
        .note {
            width: 25px;
            height: 25px;
            background-color: #e74c3c;
            border: 3px solid #fff;
            border-radius: 50%;
            position: absolute;
            z-index: 10;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 2px 2px 0px #000;
        }

        /* ปุ่มกดคอร์ด */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        button {
            font-family: 'Press Start 2P', cursive;
            background-color: #27ae60;
            color: white;
            border: 4px solid #000;
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s;
        }
        button:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        /* เลขบอกเฟรตและสาย */
        .fret-label {
            position: absolute;
            top: -45px;
            color: #f1c40f;
            font-size: 18px;
            text-shadow: 3px 3px #000;
            z-index: 5;
        }
        .string-label {
            position: absolute;
            left: -40px;
            color: #3498db;
            font-size: 16px;
            text-shadow: 3px 3px #000;
            z-index: 5;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>

    <h1>8-BIT GUITAR CHORDS</h1>

    <div class="container">
        <!-- ตัวการ์ตูน -->
        <div class="character-img"></div>
        <p id="chord-display">CHORD: -</p>

        <!-- ปุ่มเปิดระบบเสียงเพื่อปลดล็อกเบราว์เซอร์ -->
        <button id="enable-audio-btn" class="audio-status-btn" onclick="initAudio()">🔊 CLICK TO START AUDIO</button>

        <!-- แผงควบคุมเสียง -->
        <div class="sound-controls">
            <div>
                <span>MODE:</span>
                <label style="display:inline-flex; margin-left:8px;">
                    <input type="radio" name="soundType" value="8bit" checked> 8-BIT
                </label>
                <label style="display:inline-flex; margin-left:8px;">
                    <input type="radio" name="soundType" value="acoustic"> ACOUSTIC
                </label>
            </div>
            <div>
                <span>VOL:</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7" onchange="updateVolume()">
            </div>
        </div>

        <!-- คอกีตาร์ -->
        <div class="fretboard" id="fretboard">
            <div class="fret-label" style="left: 12.5%; transform: translateX(-50%);">1</div>
            <div class="fret-label" style="left: 37.5%; transform: translateX(-50%);">2</div>
            <div class="fret-label" style="left: 62.5%; transform: translateX(-50%);">3</div>
            <div class="fret-label" style="left: 87.5%; transform: translateX(-50%);">4</div>

            <div class="string-label" style="top: 10%;">6</div>
            <div class="string-label" style="top: 26%;">5</div>
            <div class="string-label" style="top: 42%;">4</div>
            <div class="string-label" style="top: 58%;">3</div>
            <div class="string-label" style="top: 74%;">2</div>
            <div class="string-label" style="top: 90%;">1</div>

            <div class="string-line string-1"></div>
            <div class="string-line string-2"></div>
            <div class="string-line string-3"></div>
            <div class="string-line string-4"></div>
            <div class="string-line string-5"></div>
            <div class="string-line string-6"></div>

            <div class="fret" id="fret-1"></div>
            <div class="fret" id="fret-2"></div>
            <div class="fret" id="fret-3"></div>
            <div class="fret" id="fret-4"></div>
        </div>

        <!-- ปุ่มกดคอร์ด (เรียงใหม่: C -> Am -> Dm -> G) -->
        <div class="controls">
            <button onclick="playChord('C')">C</button>
            <button onclick="playChord('Am')">Am</button>
            <button onclick="playChord('Dm')">Dm</button>
            <button onclick="playChord('G')">G</button>
        </div>
    </div>

    <script>
        const chordData = {
            'C':  [{ fret: 1, string: 2 }, { fret: 2, string: 4 }, { fret: 3, string: 5 }],
            'Am': [{ fret: 1, string: 2 }, { fret: 2, string: 4 }, { fret: 2, string: 3 }],
            'Dm': [{ fret: 1, string: 1 }, { fret: 2, string: 3 }, { fret: 3, string: 2 }],
            'G':  [{ fret: 2, string: 5 }, { fret: 3, string: 6 }, { fret: 3, string: 1 }]
        };

        const chordFrequencies = {
            'C': [130.81, 164.81, 196.00, 261.63, 329.63],
            'Am': [110.00, 164.81, 220.00, 261.63, 329.63],
            'Dm': [146.83, 220.00, 293.66, 349.23],
            'G': [98.00, 123.47, 146.83, 196.00, 246.94, 392.00]
        };

        let audioCtx = null;
        let masterGain = null;

        function initAudio() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();

                    masterGain = audioCtx.createGain();
                    const initialVol = parseFloat(document.getElementById('volume-slider').value);
                    masterGain.gain.setValueAtTime(initialVol, audioCtx.currentTime);
                    masterGain.connect(audioCtx.destination);
                }

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const btn = document.getElementById('enable-audio-btn');
                btn.style.backgroundColor = '#27ae60';
                btn.innerText = '🔊 AUDIO READY!';
            } catch (e) {
                console.error("Web Audio API Error:", e);
            }
        }

        function updateVolume() {
            if (masterGain && audioCtx) {
                const vol = parseFloat(document.getElementById('volume-slider').value);
                masterGain.gain.setValueAtTime(vol, audioCtx.currentTime);
            }
        }

        function playTone(freq, startTime, soundMode) {
            if (!audioCtx || !masterGain) return;

            try {
                const osc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                if (soundMode === '8bit') {
                    osc.type = 'square';
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(3000, startTime);

                    noteGain.gain.setValueAtTime(0.3, startTime);
                    noteGain.gain.linearRampToValueAtTime(0.001, startTime + 0.6);
                } else {
                    osc.type = 'triangle';
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(2000, startTime);
                    filter.frequency.linearRampToValueAtTime(400, startTime + 1.0);

                    noteGain.gain.setValueAtTime(0.6, startTime);
                    noteGain.gain.linearRampToValueAtTime(0.001, startTime + 1.0);
                }

                osc.frequency.setValueAtTime(freq, startTime);

                osc.connect(filter);
                filter.connect(noteGain);
                noteGain.connect(masterGain);

                osc.start(startTime);
                osc.stop(startTime + 1.1);
            } catch (err) {
                console.error("Playback error:", err);
            }
        }

        function playChord(chordName) {
            initAudio();

            document.getElementById('chord-display').innerText = 'CHORD: ' + chordName;
            
            // 1. ลบจุดเก่าออก
            document.querySelectorAll('.note').forEach(n => n.remove());

            // 2. แสดงจุดกดบนคอกีตาร์
            const notes = chordData[chordName];
            notes.forEach(n => {
                const fretDiv = document.getElementById('fret-' + n.fret);
                if (!fretDiv) return;

                const noteDot = document.createElement('div');
                noteDot.classList.add('note');
                noteDot.style.display = 'block';
                
                const yPositions = { 1: "90%", 2: "74%", 3: "58%", 4: "42%", 5: "26%", 6: "10%" };
                noteDot.style.top = yPositions[n.string];
                noteDot.style.left = "50%";

                fretDiv.appendChild(noteDot);
            });

            // 3. เล่นเสียง
            const freqs = chordFrequencies[chordName];
            const strumSpeed = 0.04; 
            const soundMode = document.querySelector('input[name="soundType"]:checked').value;

            const now = audioCtx.currentTime;
            freqs.forEach((freq, index) => {
                const startTime = now + (index * strumSpeed);
                playTone(freq, startTime, soundMode);
            });
        }
    </script>
</body>
</html>
