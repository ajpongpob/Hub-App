<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Teaching Media</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      width: min(680px, calc(100% - 32px));
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(15,23,42,.08);
      text-align: center;
    }
    h1 { margin-top: 0; }
    p { color: #64748b; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ตัวอย่างสื่อการสอน</h1>
    <p>
      ไฟล์นี้เป็นตัวอย่างเท่านั้น คุณสามารถลบออกแล้วนำไฟล์ HTML ของสื่อจริง
      มาใส่ในโฟลเดอร์ <strong>media</strong> ได้เลย
    </p>
  </div>
</body>
</html>
